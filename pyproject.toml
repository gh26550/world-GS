[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-gs"
version = "0.1.0"
description = "Prompt to mesh-guided 360 reference views and Gaussian splats"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "scipy>=1.10", "trimesh>=4.0", "embreex>=2.17", "rtree>=1.0"]

[project.optional-dependencies]
generation = ["torch>=2.4", "diffusers>=0.30,<1", "transformers>=4.45,<5", "accelerate>=0.34", "safetensors"]
training = ["torch>=2.4", "gsplat>=1.5,<2"]

[project.scripts]
worldgs = "worldgs.cli:main"

[tool.setuptools.packages.find]
include = ["worldgs*"]
